name: userland

on:
  workflow_dispatch:
  push:
    branches: [sapphire, main]
    paths:
      - "userland/**"
      - ".github/workflows/userland.yml"

concurrency:
  group: userland-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies & SDK
        run: |
          mkdir -p /usr/local/bin $HOME/sdks
          cat <<'EOF' | sudo tee /usr/local/bin/ldid >/dev/null
          #!/bin/sh
          ent=""
          target=""
          for arg in "$@"; do
            case "$arg" in
              -S) ;;
              -S*) ent="${arg#-S}" ;;
              *) target="$arg" ;;
            esac
          done
          if [ -n "$target" ] && [ -e "$target" ]; then
            if [ -n "$ent" ] && [ -f "$ent" ]; then
              codesign --force --sign - --entitlements "$ent" "$target"
            else
              codesign --force --sign - "$target"
            fi
          fi
          EOF
          sudo chmod +x /usr/local/bin/ldid
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/sdks/theos-sdks

      - name: Build userland components
        run: |
          SDK_PATH="$HOME/sdks/theos-sdks/iPhoneOS16.5.sdk"
          if [ ! -d "$SDK_PATH" ]; then
            SDK_PATH=$(find $HOME/sdks/theos-sdks -maxdepth 1 -name "iPhoneOS*.sdk" | sort -V | tail -1)
          fi
          echo "Using SDK: $SDK_PATH"
          LDID_BIN=$(which ldid)
          cd userland
          mkdir -p obj

          # 1. Build btcapability & nocamera/AVCamera tweaks
          echo "Building SapphireBTCapability..."
          cd tweaks/btcapability
          SDK="$SDK_PATH" LDID="$LDID_BIN" bash build.sh ../../obj
          cd ../..

          echo "Building SapphireNoCamera (AVFoundation camd bridge)..."
          cd tweaks/nocamera
          SDK="$SDK_PATH" LDID="$LDID_BIN" CLANG="clang" bash build.sh ../../obj
          cd ../..

          echo "Building SapphireFigShim (mediaserverd CMCapture shim)..."
          cd tweaks/figshim
          SDK="$SDK_PATH" LDID="$LDID_BIN" CLANG="clang" bash build.sh ../../obj
          cd ../..

          echo "Building camd & camctl..."
          cd camera/camd
          SDK="$SDK_PATH" LDID="$LDID_BIN" CLANG="clang" bash build.sh ../../obj
          cd ../..

          # 2. Build btmonitor & daemons
          echo "Building btmonitor..."
          clang -target arm64-apple-ios16.0 -isysroot "$SDK_PATH" -O2 -Wall -o obj/btmonitor bluetooth/btmonitor.c
          $LDID_BIN -S obj/btmonitor

          echo "Building sensord..."
          clang -target arm64-apple-ios16.0 -isysroot "$SDK_PATH" -O2 -Wall -o obj/sensord sensors/sensord.c || true
          $LDID_BIN -S obj/sensord || true

          echo "Building vibd..."
          clang -target arm64-apple-ios16.0 -isysroot "$SDK_PATH" -O2 -Wall -o obj/vibd haptics/vibd.c || true
          $LDID_BIN -S obj/vibd || true

          echo "Building thermald..."
          clang -target arm64-apple-ios16.0 -isysroot "$SDK_PATH" -O2 -Wall -o obj/thermald thermal/thermald.c || true
          $LDID_BIN -S obj/thermald || true

          # 3. Build eagl.dylib
          echo "Building eagl.dylib..."
          clang -target arm64-apple-ios16.0 -isysroot "$SDK_PATH" -Isrc -Iobj -O2 -Wall -dynamiclib -undefined dynamic_lookup -o obj/eagl.dylib src/eagl.c \
            -framework Foundation -framework IOKit -framework CoreFoundation -framework CoreGraphics -framework QuartzCore -framework AudioToolbox -framework IOSurface -framework OpenGLES -ldl -lpthread
          $LDID_BIN -S obj/eagl.dylib

          # 4. Build fingerprint components
          echo "Building fingerprint..."
          cd fingerprint
          SDK="$SDK_PATH" LDID="$LDID_BIN" bash build.sh ../obj || true
          cd ..

          # 5. Build SapphireTools.app + toolsd helper
          echo "Building SapphireTools.app..."
          cd apps/SapphireTools
          make SDK="$SDK_PATH" LDID="$LDID_BIN"
          codesign --force --sign - --entitlements entitlements.plist build/SapphireTools.app/SapphireTools
          cp -R build/SapphireTools.app ../../obj/
          clang -target arm64-apple-ios16.0 -isysroot "$SDK_PATH" -O2 -Wall -o ../../obj/sapphire-toolsd toolsd.c
          codesign --force --sign - --entitlements entitlements.plist ../../obj/sapphire-toolsd
          codesign --force --sign - --entitlements entitlements.plist ../../obj/camd
          codesign --force --sign - --entitlements entitlements.plist ../../obj/camctl
          codesign --force --sign - ../../obj/SapphireNoCamera.dylib
          codesign --force --sign - ../../obj/SapphireFigShim.dylib
          cp com.sapphire.toolsd.plist ../../obj/
          cd ../..

          # 6. Build standalone brightness bridge for backboardd (sweetmetal=2)
          echo "Building SapphireBrightness..."
          clang -target arm64-apple-ios16.0 -isysroot "$SDK_PATH" -O2 -Wall -dynamiclib -install_name /redwood/lib/SapphireBrightness.dylib -o obj/SapphireBrightness.dylib brightness/SapphireBrightness.c -framework CoreFoundation -framework IOKit -lobjc -lm
          codesign --force --sign - obj/SapphireBrightness.dylib
          clang -target arm64-apple-ios16.0 -isysroot "$SDK_PATH" -O2 -Wall -o obj/bkstart brightness/bkstart.c
          codesign --force --sign - obj/bkstart

          # 7. Build third-party AVFoundation virtual camera tweak (NV12 + BGRA + Vision QR + Photo)
          echo "Building SapphireAVCamera.dylib..."
          clang -target arm64-apple-ios16.0 -isysroot "$SDK_PATH" -O2 -Wall -fobjc-arc -dynamiclib \
            -install_name /var/jb/usr/lib/TweakInject/SapphireAVCamera.dylib \
            -o obj/SapphireAVCamera.dylib tweaks/avcamera/SapphireAVCamera.m \
            -framework AVFoundation -framework CoreMedia -framework CoreVideo -framework Foundation \
            -framework IOSurface -framework QuartzCore -framework UIKit -framework Vision -lobjc
          codesign --force --sign - obj/SapphireAVCamera.dylib
          cp tweaks/avcamera/SapphireAVCamera.plist obj/

          # 8. Build QMI LOC GNSS client/daemon
          echo "Building sapphire-gpsd..."
          clang -target arm64-apple-ios16.0 -isysroot "$SDK_PATH" -O2 -Wall -o obj/sapphire-gpsd gps/sapphire-gpsd.c
          codesign --force --sign - obj/sapphire-gpsd

          ls -la obj/

      - uses: actions/upload-artifact@v4
        with:
          name: userland-binaries
          path: userland/obj/
          if-no-files-found: warn
